[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamixel-sdk-wrapper"
version = "0.1.0"
description = "A command-driven Python wrapper for the Dynamixel SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "dynamixel-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/engineerm-jp/dynamixel-sdk-python-wrapper"
Issues = "https://github.com/engineerm-jp/dynamixel-sdk-python-wrapper/issues"

[tool.setuptools.packages.find]
include = ["dynamixel_sdk_wrapper*"]
